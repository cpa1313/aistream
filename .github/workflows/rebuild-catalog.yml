name: Rebuild catalog

# Whenever new-videos.json changes, regenerate data-part-3.js and push it.
# The site deploy (Cloudflare) then picks up the new commit automatically.
on:
  push:
    paths:
      - '**/new-videos.json'
      - '**/build_new_part.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild data-part-3.js from new-videos.json
        run: node scripts/build_new_part.mjs

      - name: Commit rebuilt file
        run: |
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "ci: rebuild data-part-3.js from new-videos.json"
            git push
          fi
