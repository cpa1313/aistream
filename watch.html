        .nav-drop { position: relative; }
        .nav-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--bg-secondary); border: 1px solid #333; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.55); padding: 0.5rem; min-width: 240px; max-height: 65vh; overflow-y: auto; z-index: 110; }

    <script>
        /* Main menu — dropdown lists are built from the live catalog so counts
           always match what is on the site. Genre/platform entries deep-link to
           index.html?genre=… / ?platform=…, which works from the watch page too. */
        (function buildMainMenu() {
            const cat = (typeof dramas !== 'undefined') ? dramas : [];
            const PLATFORM_LABELS = { dramawave:'DramaWave', blinkdrama:'BlinkDrama', yourchannel:'YourChannel', goodshort:'GoodShort', reelshort:'ReelShort', stardust:'Stardust', flickreels:'FlickReels', livoshort:'LivoShort', cinerra:'Cinerra', miraluneshort:'Miralune Short', rivoshort:'RivoShort', joyreels:'JoyReels', idrama:'iDrama', snackshort:'SnackShort', flareflow:'FlareFlow', netshort:'NetShort', meloshort:'MeloShort', moboreels:'MoboReels', vibeshort:'VibeShort', minishort:'MiniShort', shotshort:'ShotShort', dramora:'Dramora', shortmax:'ShortMax', dramabox:'DramaBox', happyshort:'HappyShort' };
            window.navPlatformLabel = p => PLATFORM_LABELS[p] || (p ? p.charAt(0).toUpperCase() + p.slice(1) : p);
            const genreNames = d => (d.genres || []).map(g => typeof g === 'string' ? g
                : (g && typeof g === 'object' ? (g.name || g.title || g.genre || g.label || '') : '')).filter(Boolean);

            const gCounts = new Map();
            cat.forEach(d => genreNames(d).forEach(g => gCounts.set(g, (gCounts.get(g) || 0) + 1)));
            const pCounts = new Map();
            cat.forEach(d => { const p = (d.platform || '').toLowerCase().trim(); if (p && p !== 'other') pCounts.set(p, (pCounts.get(p) || 0) + 1); });

            const gEl = document.getElementById('navGenres');
            if (gEl) gEl.innerHTML = '<div class="nav-menu-head">Browse by genre</div>'
                + [...gCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20)
                    .map(([g, c]) => `<a href="index.html?genre=${encodeURIComponent(g)}">${g}<span class="cnt">${c.toLocaleString('en-US')}</span></a>`).join('');
            const pEl = document.getElementById('navPlatforms');
            if (pEl) pEl.innerHTML = '<div class="nav-menu-head">Browse by platform</div>'
                + [...pCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14)
                    .map(([p, c]) => `<a href="index.html?platform=${encodeURIComponent(p)}">${window.navPlatformLabel(p)}<span class="cnt">${c.toLocaleString('en-US')}</span></a>`).join('');

            const burger = document.getElementById('navBurger');
            const nav = document.getElementById('mainNav');
            if (!burger || !nav) return;
            burger.addEventListener('click', () => {
                const open = nav.classList.toggle('open');
                burger.setAttribute('aria-expanded', open);
                burger.textContent = open ? '✕' : '☰';
            });
            nav.querySelectorAll('.nav-drop-btn').forEach(btn => btn.addEventListener('click', () => {
                const drop = btn.closest('.nav-drop');
                const wasOpen = drop.classList.contains('open');
                nav.querySelectorAll('.nav-drop.open').forEach(d => d.classList.remove('open'));
                if (!wasOpen) drop.classList.add('open');
            }));
            nav.addEventListener('click', e => {
                if (!e.target.closest('a')) return;
                nav.classList.remove('open');
                burger.textContent = '☰';
                burger.setAttribute('aria-expanded', 'false');
                nav.querySelectorAll('.nav-drop.open').forEach(d => d.classList.remove('open'));
            });
        })();
    </script>

            if (!base0) return url;
            try {
                if (!SEGMENT_PROXY_HOSTS.includes(new URL(url, location.href).hostname)) return url;
                // accept a bare worker URL too — append the ?u= query name if it's missing
                const base = /[?&]u=$/.test(base0)
                    ? base0
                    : base0.replace(/\/+$/, '') + '/?u=';
                return base + encodeURIComponent(url);
            } catch { return url; }
        }
        const SegmentProxyLoader = (window.Hls && window.Hls.DefaultConfig && window.Hls.DefaultConfig.loader)
            ? class extends window.Hls.DefaultConfig.loader {
                load(context, config, callbacks) {
                    if (context && context.url) context.url = proxiedUrl(context.url);
                    super.load(context, config, callbacks);
                }
            }
            : null; // hls.js failed to load — fall back to its default loader

        function loadChunkScript(n) {
            if (chunkCache[n]) return chunkCache[n];
            chunkCache[n] = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = `eps/chunk-${n}.js`;
                s.onload = resolve;
                s.onerror = () => reject(new Error(`Could not load eps/chunk-${n}.js (is the eps folder uploaded next to watch.html?)`));
                document.head.appendChild(s);
            });
            return chunkCache[n];
        }

        function dunResolverMirror(count) {
            // Fresh-link fallback: one resolver URL per episode position.
            // The worker 302-redirects to a freshly signed dramadunyam relay;
            // episodes dun can't serve return 404 and just show the normal error.
            const RBASE = dunResolverBase();
            if (!RBASE || !currentDrama) return null;
            if (currentDrama.source !== 'dramadunyam') return null;
            if (!/^\d+$/.test(String(currentDrama.id))) return null;
            return Array.from({ length: count }, (_, i) => `${RBASE}/${currentDrama.id}/${i + 1}`);
        }

        async function resolveSources(drama) {
            let base = null;
            // v5.5.3 — baked-dun links (eps/chunk-dun*.js, fresh from
            // refresh_eps_from_home.mjs) outrank everything else for dun
            // records: their stored `urls` are signed and expire within days,
            // and epsChunk files hold the same dead links. Only when nothing
            // is baked do we fall through to the original chain below.
            if (drama.source === 'dramadunyam') {
                try {
                    await loadChunkScript('dun');
                    const no = window.DB_EPS_DUN_INDEX && window.DB_EPS_DUN_INDEX[drama.slug];
                    if (no) { try { await loadChunkScript('dun-' + no); } catch (e) { /* index pointed here; ignore */ } }
                } catch (e) { /* no baked dun chunks uploaded yet */ }
                const recDun = window.DB_EPS[drama.slug];
                if (Array.isArray(recDun) && recDun.length) base = Array.isArray(recDun[0]) ? recDun : [recDun];
                else if (recDun && recDun.mirrors && recDun.mirrors.length) base = recDun.mirrors;
                if (base) {
                    currentDrama = drama;               // dunResolverMirror reads id/source off it
                    const resolver = dunResolverMirror(drama.episodes || base[0].length || 0);
                    if (resolver) base.push(resolver);  // fresh-link fallback for eps beyond the bake
                    return base;
                }
            }
            if (drama.urls && drama.urls.length) {
                base = [drama.urls];
            } else if (drama.epsChunk) {
                try { await loadChunkScript(drama.epsChunk); } catch (e) { throw e; }
                const rec = window.DB_EPS[drama.slug];
                // chunk files store {"slug": [ep1url, ep2url, ...]} — one flat
                // array (first mirror). Wrap it as [[...]] so mirror handling
                // stays uniform; tolerate nested arrays just in case.
                if (Array.isArray(rec) && rec.length) base = Array.isArray(rec[0]) ? rec : [rec];
                else if (rec && rec.mirrors && rec.mirrors.length) base = rec.mirrors;
                else if (drama.source === 'dramadunyam') {
                    // v5.5.2 — dun records carry epsChunk, so the dun branch
                    // below never ran for them. No stored eps links → read the
                    // baked chunk-dun files here, before the resolver-only
                    // bootstrap at the end of resolveSources.
                    try {
                        await loadChunkScript('dun');
                        const no = window.DB_EPS_DUN_INDEX && window.DB_EPS_DUN_INDEX[drama.slug];
                        if (no) { try { await loadChunkScript('dun-' + no); } catch (e) { /* index pointed here; ignore */ } }
                    } catch (e) { /* no baked dun chunks uploaded yet */ }
                    const recDun = window.DB_EPS[drama.slug];
                    if (Array.isArray(recDun) && recDun.length) base = Array.isArray(recDun[0]) ? recDun : [recDun];
                    else if (recDun && recDun.mirrors && recDun.mirrors.length) base = recDun.mirrors;
                }
            } else if (drama.source === 'dramadunyam') {
                // Baked dun links (eps/chunk-dun*.js) from refresh_eps_from_home.mjs.
                // chunk-dun.js is a small slug→chunk index; the link arrays live
                // in chunk-dun-<no>.js and Object.assign into the same
                // window.DB_EPS the epsChunk path reads. Missing files reject —
                // tolerated, the /dun resolver fallback below still applies.
                try {
                    await loadChunkScript('dun');
                    const no = window.DB_EPS_DUN_INDEX && window.DB_EPS_DUN_INDEX[drama.slug];
                    if (no) { try { await loadChunkScript('dun-' + no); } catch (e) { /* index pointed here; ignore */ } }
                } catch (e) { /* no baked dun chunks uploaded yet */ }
                const recDun = window.DB_EPS[drama.slug];
                if (Array.isArray(recDun) && recDun.length) base = Array.isArray(recDun[0]) ? recDun : [recDun];
                else if (recDun && recDun.mirrors && recDun.mirrors.length) base = recDun.mirrors;
            }

            currentDrama = drama; // dunResolverMirror reads id/source off it
            const resolver = dunResolverMirror(drama.episodes || (base && base[0] && base[0].length) || 0);
            if (!base) return resolver ? [resolver] : [];       // nothing stored — resolver-only bootstrap
            if (resolver) base.push(resolver);                  // stored first, fresh-link fallback last
            return base;
        }

        function candidatesFor(episode) {
            // One playable URL per mirror for this episode
            return sources.map(m => m[episode - 1]).filter(Boolean);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (slug) {
                const drama = dramas.find(d => d.slug === slug);
                if (drama) {
                    // View counting happens per EPISODE START inside loadVideo()
                    // (see countView() above): every episode a viewer plays adds
                    // one view, matching how reel platforms count. loadPlayer()
                    // -> loadVideo(1) fires the first one automatically.
                    loadPlayer(drama);
                    updateSEO(drama);
                } else {
                    document.getElementById('playerTitle').textContent = "Drama Not Found";
                    document.getElementById('playerDesc').innerHTML = '<div class="error-msg">The requested drama could not be found. <a href="index.html" style="color: var(--accent);">Return to Homepage</a></div>';
                    document.getElementById('loadingText').style.display = 'none';
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        function toggleEpisodes() {
            const grid = document.getElementById('episodeGrid');
            const toggle = document.querySelector('.episode-toggle');
            grid.classList.toggle('collapsed');
            toggle.textContent = grid.classList.contains('collapsed') ? 'Show episodes v' : 'Hide episodes ^';
        }

        // Normalize genres to plain names: records may store strings, objects
        // ({name}/{title}/{genre}/{label}) or nothing at all — anything unusable
        // is dropped so "[object Object]" can never appear.
        function genreNames(d) {
            return (d.genres || []).map(g =>
                typeof g === 'string' ? g
                    : (g && typeof g === 'object' ? (g.name || g.title || g.genre || g.label || '') : '')
            ).filter(Boolean);
        }

        function updateSEO(drama) {
            const title = `Watch ${drama.title} - ${drama.episodes} Episodes Free | DramaStream`;
            document.title = title;

            const description = drama.description || drama.about || `Watch ${drama.title} free online. ${drama.episodes} episodes available on DramaStream.`;
            document.querySelector('meta[name="description"]').setAttribute('content', description);

            const keywords = `${drama.title}, ${drama.platform}, short drama, free drama, watch online, ${genreNames(drama).join(', ')}`;
            document.querySelector('meta[name="keywords"]').setAttribute('content', keywords);

            const canonicalUrl = `${window.location.origin}${window.location.pathname}?slug=${drama.slug}`;
            document.querySelector('link[rel="canonical"]').setAttribute('href', canonicalUrl);

            document.querySelector('meta[property="og:title"]').setAttribute('content', title);
            document.querySelector('meta[property="og:description"]').setAttribute('content', description);
            document.querySelector('meta[property="og:image"]').setAttribute('content', drama.cover);
            document.querySelector('meta[property="og:url"]').setAttribute('content', canonicalUrl);

            document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
            document.querySelector('meta[name="twitter:description"]').setAttribute('content', description);
            document.querySelector('meta[name="twitter:image"]').setAttribute('content', drama.cover);

            const structuredData = {
                "@context": "https://schema.org",
                "@type": "TVSeries",
                "name": drama.title,
                "description": description,
                "genre": genreNames(drama),
                "numberOfEpisodes": drama.episodes,
                "url": canonicalUrl,
                "image": drama.cover,
                "aggregateRating": drama.rating > 0 ? {
                    "@type": "AggregateRating",
                    "ratingValue": drama.rating.toString(),
                    "bestRating": "10"
                } : undefined,
                "publisher": {
                    "@type": "Organization",
                    "name": "DramaStream",
                    "url": window.location.origin
                }
            };

            document.getElementById('structuredData').textContent = JSON.stringify(structuredData, null, 2);
        }

        function showMsg(text, color) {
            const el = document.getElementById('loadingText');
            el.style.display = 'block';
            el.textContent = text;
            el.style.color = color || 'white';
        }

        function hideMsg() {
            document.getElementById('loadingText').style.display = 'none';
        }

        async function loadPlayer(drama) {
            currentDrama = drama;
            currentEpisode = 1;
            activeMirror = 0;

            document.getElementById('playerTitle').textContent = drama.title;

            // Show which video this is: cover card image + poster behind the player
            const coverEl = document.getElementById('playerCover');
            if (drama.cover) {
                coverEl.src = drama.cover;
                coverEl.alt = drama.title + ' cover';
                coverEl.style.display = '';
            } else {
                coverEl.style.display = 'none';
            }
            document.getElementById('videoPlayer').poster = drama.cover || '';

            document.getElementById('playerDesc').textContent = drama.description || drama.about || "No description available.";
            document.getElementById('playerPlatform').textContent = (drama.platform || 'unknown').toUpperCase();
            document.getElementById('episodeCount').textContent = `(${drama.episodes} episodes)`;

            if (drama.about && drama.about.length > 50) {
                const aboutEl = document.getElementById('playerAbout');
                aboutEl.textContent = drama.about;
                aboutEl.style.display = 'block';
            }

            const metaInfo = document.getElementById('metaInfo');
            const metaParts = [];
            if (drama.rating > 0) metaParts.push(`<span><strong>Rating:</strong> ${drama.rating}/10</span>`);
            if (drama.releaseDate) metaParts.push(`<span><strong>Released:</strong> ${drama.releaseDate}</span>`);
            metaParts.push(`<span><strong>${drama.episodes} Episodes</strong></span>`);
            metaInfo.innerHTML = metaParts.join('');

            const genresContainer = document.getElementById('playerGenres');
            const genreList = genreNames(drama);
            genresContainer.innerHTML = genreList.map(g => `<a class="genre-tag" href="index.html?genre=${encodeURIComponent(g)}">${g}</a>`).join('');
            genresContainer.style.display = genreList.length ? '' : 'none';

            // Resolve the real episode URLs first (inline or from eps chunk file)
            showMsg('Loading episodes...');
            let loadError = false;
            try {
                sources = await resolveSources(drama);
            } catch (e) {
                sources = [];
                loadError = true;
                showMsg('❌ ' + e.message, '#ff4444');
            }

            const available = sources.length ? sources[0].length : 0;
            if (!available) {
                if (loadError) return; // chunk/error message already shown
                showMsg('This title is in the catalog, but its video source has not been attached yet. Run the dramadunyam console scraper and merge to add its episodes.', '#ffcc66');
                return;
            }
            if (available < drama.episodes) {
                // Source returned fewer episodes than advertised – only offer what exists
                document.getElementById('episodeCount').textContent = `(${available} of ${drama.episodes} episodes)`;
            }

            const select = document.getElementById('episodeSelect');
            select.innerHTML = '';
            for (let i = 1; i <= available; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Episode ${i}`;
                select.appendChild(option);
            }

            createEpisodeGrid(available);
            loadVideo(1);
        }

        function createEpisodeGrid(available) {
            const grid = document.getElementById('episodeGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= available; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-btn';
                if (i === currentEpisode) btn.classList.add('active');
                btn.textContent = i;
                btn.onclick = () => jumpToEpisode(i);
                grid.appendChild(btn);
            }
        }

        function updateEpisodeButtons(available) {
            const buttons = document.querySelectorAll('.episode-btn');
            buttons.forEach((btn, index) => {
                const epNum = index + 1;
                btn.classList.toggle('active', epNum === currentEpisode);
            });

            document.getElementById('prevBtn').disabled = currentEpisode === 1;
            document.getElementById('nextBtn').disabled = currentEpisode >= available;
            document.getElementById('episodeSelect').value = currentEpisode;
        }

        // ==========================================
        // VIDEO LOADING (per-episode signed URLs with mirror fallback)
        // ==========================================
        function destroyHls() {
            if (hls) { hls.destroy(); hls = null; }
        }

        function loadVideo(ep) {
            currentEpisode = parseInt(ep) || 1;
            activeMirror = 0;
            workerRetried = false;   // v5.8.1 — fresh failover budget per episode
            const available = sources.length ? sources[0].length : 0;
            if (currentEpisode > available) currentEpisode = available;
            if (available && currentEpisode >= 1) countView();  // 1 view = 1 episode started
            updateEpisodeButtons(available);
            playCurrent();
        }

        // ==========================================
        // UPLOAD-HOSTED EMBEDS (Streamable etc.)
        // Episodes you upload yourself can point at embed pages instead of
        // HLS/MP4 URLs, e.g. https://streamable.com/e/9t47ph?loop=0 (the
        // /e/<id> form is Streamable's official iframe player). These play in
        // an <iframe> that shares the player box with the native <video>;
        // exactly one of the two is visible at any moment. Plain Streamable
        // watch URLs (streamable.com/<id>) are normalized to /e/<id> embeds.
        // ==========================================
        function embedHost(url) {
            try { return (new URL(url, location.href).hostname || '').replace(/^www\./, ''); }
            catch { return ''; }
        }
        function isEmbedUrl(url) {
            const h = embedHost(url);
            if (h === 'streamable.com') return true;                  // /e/, /o/ and plain watch URLs all normalize
            if (h === 'youtube.com' || h === 'youtube-nocookie.com') return url.includes('/embed/');
            if (h === 'player.vimeo.com') return url.includes('/video/');
            if (h === 'dailymotion.com') return url.includes('/embed/');
            return false;
        }
        function embedSrc(url) {
            if (embedHost(url) === 'streamable.com') {
                try {
                    const u = new URL(url, location.href);
                    const m = u.pathname.match(/^\/(?:e|o)\/([A-Za-z0-9]+)\/?$/)
                           || u.pathname.match(/^\/([A-Za-z0-9]+)\/?$/);
                    if (m) return `https://streamable.com/e/${m[1]}${u.search}`;  // keeps ?loop=0 etc.
                } catch {}
                return url;
            }
            return url;
        }
        let embedLoadTimer = null;
        function destroyEmbed() {
            // Swap back to the native <video> and stop any embed that is
            // playing — clearing the src is what actually stops the iframe's
            // audio; hiding it alone would leave the episode running.
            const frame = document.getElementById('embedPlayer');
            document.getElementById('videoPlayer').style.display = '';
            if (frame) {
                frame.style.display = 'none';
                if (frame.src && frame.src !== 'about:blank') frame.src = 'about:blank';
            }
            clearTimeout(embedLoadTimer);
        }
        function playEmbed(url) {
            const frame = document.getElementById('embedPlayer');
            document.getElementById('videoPlayer').style.display = 'none';
            frame.style.display = 'block';   // CSS default is none; '' would not unhide it
            let settled = false;
            frame.onload = () => { settled = true; hideMsg(); };
            frame.src = embedSrc(url);
            clearTimeout(embedLoadTimer);
            // Embed pages don't report playback errors to the parent, so if
            // the iframe never even loads, say so but keep trying — the
            // viewer can still switch episodes or mirrors manually.
            embedLoadTimer = setTimeout(() => {
                if (!settled && frame.style.display !== 'none') {
                    showMsg('Still loading... if nothing appears, this episode may be unavailable — try another episode.', '#ffcc66');
                }
            }, 12000);
        }

        function playNative(url, candidates) {
            // Native <video> playback (progressive MP4). One attempt per
            // candidate: on error, advance to the next mirror exactly like
            // the hls.js path does.
            const video = document.getElementById('videoPlayer');
            // v5.5.4 — never let a lingering crossorigin attribute force CORS
            // mode on native loads; DramaBox/CloudFront sends no ACAO and the
            // browser then blocks valid links with status 0 / error code 4.
            video.removeAttribute('crossorigin');
            video.addEventListener('error', () => {
                if (activeMirror + 1 < candidates.length) {
                    activeMirror++;
                    showMsg(`Source failed, trying mirror ${activeMirror + 1}...`);
                    playCurrent();
                } else {
                    showMsg('❌ Error: Video failed to load. Try another episode or come back later.', '#ff4444');
                }
            }, { once: true });
            video.src = proxiedUrl(url);
            video.addEventListener('loadedmetadata', () => {
                hideMsg();
                video.play().catch(() => {});
            }, { once: true });
        }

        function playCurrent() {
            const video = document.getElementById('videoPlayer');
            const candidates = candidatesFor(currentEpisode);

            if (!candidates.length) {
                showMsg('This episode could not be loaded — its source has not been attached yet or is temporarily unavailable.', '#ffcc66');
                return;
            }

            showMsg('Loading video...');
            video.pause();
            video.removeAttribute('src');
            video.load();
            destroyHls();

            const url = candidates[activeMirror];

            // Upload-hosted embed (Streamable etc.)? Swap the native player
            // for the embed iframe. Mirror fallback cannot be auto-detected
            // across iframes, so the embed is the last stop for this episode.
            if (isEmbedUrl(url)) {
                playEmbed(url);
                return;
            }
            destroyEmbed();   // restore the native <video> when leaving an embed source

            if (/\.mp4($|\?)/.test(url)) {
                // Progressive MP4 (e.g. DramaBox CDN links) — play natively,
                // no hls.js. Same mirror-fallback as the native HLS path.
                playNative(url, candidates);
                return;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    xhrSetup: (xhr) => { xhr.withCredentials = false; },
                    // pLoader is REQUIRED along with fLoader: hls.js loads the
                    // master/level playlists via pLoader (fallback: `loader`),
                    // never fLoader — fLoader alone leaves the first .m3u8
                    // request going direct, which referer-locked CDNs 403.
                    ...(SegmentProxyLoader ? { pLoader: SegmentProxyLoader, fLoader: SegmentProxyLoader } : {}),
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    hideMsg();
                    video.play().catch(() => {});
                });
                hls.on(Hls.Events.FRAG_LOADED, () => hideMsg());
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (!data.fatal) return;
                    // The /dun/ resolver redirects to whatever the upstream
                    // serves. DramaBox-family relays hand out progressive MP4
                    // on extensionless signed URLs, so the candidate URL has
                    // no .mp4 suffix for the check above — hls.js receives
                    // MP4 bytes and dies with manifestParsingError. Retry the
                    // SAME candidate natively (the browser follows the worker's
                    // 302 and plays the MP4 directly) before moving on.
                    if (data.details === 'manifestParsingError') {
                        destroyHls();
                        video.removeAttribute('src');
                        video.load();
                        playNative(url, candidates);
                        return;
                    }
                    // v5.8.1 — worker failover FIRST: with priority picking a
                    // dead worker (quota 429 / outage) must not kill playback
                    // on single-mirror titles, for which the mirror-advance
                    // branch below never runs. Flip to the next worker and
                    // retry the SAME mirror once before touching mirrors.
                    if (!workerRetried && PROXY_WORKERS.length > 1 && flipWorker()) {
                        workerRetried = true;
                        showMsg('Playback worker failed — switching to backup worker...');
                        playCurrent();
                        return;
                    }
                    // Try the next mirror before giving up
                    if (activeMirror + 1 < candidates.length) {
                        activeMirror++;
                        showMsg(`Source failed, trying mirror ${activeMirror + 1}...`);
                        playCurrent();
                    } else {
                        let failHost = '';
                        try { failHost = data.frag && data.frag.url ? new URL(data.frag.url).hostname : ''; } catch {}
                        if (!segmentProxyBase() && SEGMENT_PROXY_HOSTS.includes(failHost)) {
                            showMsg('❌ Error: this title\'s video CDN blocks playback from hosted sites. Fix: deploy segment-proxy-worker.js (see README), then set SEGMENT_PROXY_BASE in this file.', '#ff4444');
                        } else if (candidates[activeMirror] && candidates[activeMirror].includes('/dun/')) {
                            showMsg('❌ Fresh-link resolver could not fetch a new link from the server (currently optimizing the video right now). Please come back later!', '#ff4444');
                        } else {
                            showMsg('❌ Error: Video failed to load (' + (data.details || 'network error') + '). Try another episode or come back later.', '#ff4444');
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // iOS / Safari native HLS
                // v5.8.1 — worker failover first, then mirrors; the once-
                // listener is re-armed for the retry attempt so a second
                // failure can still advance mirrors.
                const nativeFail = () => {
                    if (!workerRetried && PROXY_WORKERS.length > 1 && flipWorker()) {
                        workerRetried = true;
                        video.addEventListener('error', nativeFail, { once: true });
                        video.src = proxiedUrl(url);
                        return;
                    }
                    if (activeMirror + 1 < candidates.length) {
                        activeMirror++;
                        playCurrent();
                    } else {
                        showMsg('❌ Error: Video failed to load.', '#ff4444');
                    }
                };
                video.addEventListener('error', nativeFail, { once: true });
                video.src = proxiedUrl(url);
                video.addEventListener('loadedmetadata', () => {
                    hideMsg();
                    video.play().catch(() => {});
                }, { once: true });
            } else {
                showMsg('❌ HLS is not supported in this browser.', '#ff4444');
            }
        }

        function changeEpisode(direction) {
            const available = sources.length ? sources[0].length : 0;
            const newEp = currentEpisode + direction;
            if (newEp >= 1 && newEp <= available) loadVideo(newEp);
        }

        function jumpToEpisode(ep) {
            loadVideo(parseInt(ep));
        }

        // Auto-play next episode when the current one finishes
        document.getElementById('videoPlayer').addEventListener('ended', () => {
            const available = sources.length ? sources[0].length : 0;
            if (currentEpisode < available) {
                loadVideo(currentEpisode + 1);
                document.getElementById('videoPlayer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    </script>
</body>
</html>
